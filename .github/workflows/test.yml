name: Run Python Tests

on:
  push:
    branches: [ "feature/nhanhc-qa-testing", "main" ]
  pull_request:
    branches: [ "feature/nhanhc-qa-testing", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Run Specific Unittest Files
      run: |
        python -m unittest tests/test_alex_auth.py tests/test_khoi_attendance.py tests/test_nhan_qa_edge_cases.py -v
